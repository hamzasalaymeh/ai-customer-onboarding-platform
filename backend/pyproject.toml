[project]
name = "ai-customer-onboarding-backend"
version = "0.1.0"
description = "Backend API for the AI Customer Onboarding Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["app", "../tests/backend"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
